[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nyt-wordle-cli"
version = "1.3.0"
description = "Play the day's NYT Wordle in your terminal — no browser, no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["wordle", "cli", "game", "terminal"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment :: Puzzle Games",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
wordle = "wordle.cli:main"

[project.urls]
Homepage = "https://github.com/NathanWalash/wordle-cli"
Repository = "https://github.com/NathanWalash/wordle-cli"
Changelog = "https://github.com/NathanWalash/wordle-cli/blob/main/CHANGELOG.md"
Issues = "https://github.com/NathanWalash/wordle-cli/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wordle = ["words.txt", "answers.txt"]
